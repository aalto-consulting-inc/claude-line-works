# Actions からバージョンを指定して実行すると、この workflow が下書きリリースを作る。
# 人がやることは中身を確認して Publish するだけ。
#
# 手順:
#   1. バージョンを上げた PR を main にマージする
#   2. Actions > Release > Run workflow でバージョン(例 0.3.1)を入力して実行
#   3. バージョン整合チェック → テスト → `.mcpb` ビルド → 資産とノート付きの下書きリリースが出来る
#   4. 内容を確認して Publish release。git タグはこのとき初めて作られる
#
# 設計上の要点:
# - `release: [created]` は draft では発火しない(GitHub の仕様)。下書き作成を起点にはできないため、
#   下書きそのものをこの workflow が作る。
# - 下書きの target は dispatch 時の main の SHA に固定する。Publish までに main が進んでも、
#   ビルドした中身とタグの指す commit がずれない。
# - ビルドが全部通ってから下書きを作る。途中で落ちたときに中途半端な下書きを残さない。
# - 再実行時に下書きが既にあれば、資産を差し替えて本文を更新する(手で書いた本文は保持する)。
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'リリースするバージョン (例: 0.3.1)'
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: build and draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      # 入力は人が打つ任意テキスト。以降のステップで使う前にここで形を固定する
      - name: Resolve tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::バージョン ($INPUT_VERSION) が x.y.z 形式ではありません"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"

      - name: Check the workflow runs on main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::リリースは main から実行してください (現在: ${{ github.ref }})"
          exit 1

      - uses: actions/checkout@v4

      # 公開済みのリリースやタグを踏み潰さない。下書きだけは再実行として引き継ぐ
      - name: Check the tag is free
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::タグ $TAG は既に存在します"
            exit 1
          fi
          state=$(gh api "repos/$REPO/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$TAG\")][0] | if . == null then \"none\" elif .draft then \"draft\" else \"published\" end")
          if [ "$state" = "published" ]; then
            echo "::error::リリース $TAG は既に公開されています"
            exit 1
          fi
          echo "RELEASE_STATE=$state" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      # 3 つのマニフェストの version と入力がずれたままリリースするのを防ぐ
      - name: Check versions match the tag
        run: |
          for f in .claude-plugin/plugin.json mcpb/manifest.json server/package.json; do
            v=$(node -p "require('./$f').version")
            if [ "$v" != "$VERSION" ]; then
              echo "::error file=$f::version ($v) が指定バージョン ($VERSION) と一致しません"
              exit 1
            fi
          done

      - run: npm ci
        working-directory: server
      - run: npm run typecheck
        working-directory: server
      - run: npm test
        working-directory: server

      - name: Build MCPB
        run: npm run build:mcpb
        working-directory: server

      - name: Check dist/server.js is up to date
        run: git diff --exit-code -- dist
        # 失敗した場合: server/ の変更後に `npm run build` を実行して dist/ をコミットし直す

      - name: Smoke test (MCP tools/list)
        run: node scripts/smoke.mjs

      # 公開配布物なので、利用者が改ざんを検知できるようチェックサムを添える。
      # `sha256sum -c line-works.mcpb.sha256` でそのまま検証できる形式で出力する
      - name: Generate checksum
        run: |
          cd build
          sha256sum line-works.mcpb > line-works.mcpb.sha256
          cat line-works.mcpb.sha256

      # 本文を組み立てる。
      # - 新規作成時は自動生成のリリースノート
      # - 再実行時は既存の下書きの本文を保持する(手で書いた内容を上書きしない)
      # - 末尾にチェックサムを追記する。マーカーで囲んで毎回置き換えるので再実行しても重複しない
      - name: Compose release notes
        run: |
          body=""
          if [ "$RELEASE_STATE" = "draft" ]; then
            body=$(gh api "repos/$REPO/releases?per_page=100" \
              --jq "[.[] | select(.tag_name == \"$TAG\")][0].body // \"\"")
          fi
          if [ -z "$body" ]; then
            gh api --method POST "repos/$REPO/releases/generate-notes" \
              -f tag_name="$TAG" -f target_commitish="$SHA" --jq .body > /tmp/body.md
          else
            printf '%s\n' "$body" > /tmp/body.md
            sed -i '/<!-- sha256:start -->/,/<!-- sha256:end -->/d' /tmp/body.md
          fi
          {
            echo
            echo '<!-- sha256:start -->'
            echo '### チェックサム'
            echo
            echo '```'
            cat build/line-works.mcpb.sha256
            echo '```'
            echo
            echo '検証: `sha256sum -c line-works.mcpb.sha256`'
            echo '(Windows は `certutil -hashfile line-works.mcpb SHA256`)'
            echo '<!-- sha256:end -->'
          } >> /tmp/body.md

      - name: Create or update the draft release
        run: |
          if [ "$RELEASE_STATE" = "draft" ]; then
            gh release edit "$TAG" --target "$SHA" --notes-file /tmp/body.md --repo "$REPO"
            gh release upload "$TAG" \
              build/line-works.mcpb \
              build/line-works.mcpb.sha256 \
              --clobber --repo "$REPO"
          else
            gh release create "$TAG" \
              build/line-works.mcpb \
              build/line-works.mcpb.sha256 \
              --draft --target "$SHA" --title "$TAG" --notes-file /tmp/body.md --repo "$REPO"
          fi
          echo "### 下書きリリース $TAG を作成しました" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "内容を確認して Publish してください: https://github.com/$REPO/releases" >> "$GITHUB_STEP_SUMMARY"
