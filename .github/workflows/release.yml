# Actions からバージョンを指定して実行すると、この workflow が下書きリリースを作る。
# 人がやることは中身を確認して Publish するだけ。
#
# 手順:
#   1. バージョンを上げた PR を main にマージする
#   2. Actions > Release > Run workflow でバージョン(例 0.3.1)を入力して実行
#   3. バージョン整合チェック → テスト → `.mcpb` ビルド → 資産とノート付きの下書きリリースが出来る
#   4. 内容を確認して Publish release。git タグはこのとき初めて作られる
#
# 設計上の要点:
# - `release: [created]` は draft では発火しない(GitHub の仕様)。下書き作成を起点にはできないため、
#   下書きそのものをこの workflow が作る。
# - 下書きの target は dispatch 時の main の SHA に固定する。Publish までに main が進んでも、
#   ビルドした中身とタグの指す commit がずれない。
# - ビルドが全部通ってから下書きを作る。途中で落ちたときに中途半端な下書きを残さない。
# - 再実行時に下書きが既にあれば、資産を差し替えて本文を更新する(手で書いた本文は保持する)。
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'リリースするバージョン (例: 0.3.1)'
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: build and draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      # 入力は人が打つ任意テキスト。以降のステップで使う前にここで形を固定する
      - name: Resolve tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::バージョン ($INPUT_VERSION) が x.y.z 形式ではありません"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"

      - name: Check the workflow runs on main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::リリースは main から実行してください (現在: ${{ github.ref }})"
          exit 1

      - uses: actions/checkout@v4

      # 公開済みのリリースやタグを踏み潰さない。下書きだけは再実行として引き継ぐ
      - name: Check the tag is free
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::タグ $TAG は既に存在します"
            exit 1
          fi
          state=$(gh api "repos/$REPO/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$TAG\")][0] | if . == null then \"none\" elif .draft then \"draft\" else \"published\" end")
          if [ "$state" = "published" ]; then
            echo "::error::リリース $TAG は既に公開されています"
            exit 1
          fi
          echo "RELEASE_STATE=$state" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      # version を書く場所すべてが入力と揃っているか確認する。
      # 1 箇所でも古いままリリースすると、配布物の名乗るバージョンとタグがずれる
      - name: Check versions match the tag
        run: |
          ng=0
          for f in .claude-plugin/plugin.json mcpb/manifest.json server/package.json server/package-lock.json; do
            v=$(node -p "require('./$f').version")
            if [ "$v" != "$VERSION" ]; then
              echo "::error file=$f::version ($v) が指定バージョン ($VERSION) と一致しません"
              ng=1
            fi
          done
          # MCP サーバが initialize で名乗るバージョン(ソース直書き)
          v=$(node -e 'const s=require("fs").readFileSync("server/src/index.ts","utf8");
            const m=s.match(/new McpServer\(\{[^}]*version:\s*"([^"]+)"/);
            if (!m) { console.error("version の記述を見つけられません"); process.exit(1); }
            console.log(m[1]);')
          if [ "$v" != "$VERSION" ]; then
            echo "::error file=server/src/index.ts::version ($v) が指定バージョン ($VERSION) と一致しません"
            ng=1
          fi
          exit $ng

      - run: npm ci
        working-directory: server
      - run: npm run typecheck
        working-directory: server
      - run: npm test
        working-directory: server

      - name: Build MCPB
        run: npm run build:mcpb
        working-directory: server

      - name: Check dist/server.js is up to date
        run: git diff --exit-code -- dist
        # 失敗した場合: server/ の変更後に `npm run build` を実行して dist/ をコミットし直す

      - name: Smoke test (MCP tools/list)
        run: node scripts/smoke.mjs

      # 資産の sha256 は GitHub がアップロード時に計算し、リリース画面と API
      # (asset の digest)で公開する。workflow 側でチェックサムを添える必要はない
      #
      # 再実行時は本文に触らない。自動生成のノートを人が書き換えていることがある
      - name: Create or update the draft release
        run: |
          if [ "$RELEASE_STATE" = "draft" ]; then
            gh release edit "$TAG" --target "$SHA" --repo "$REPO"
            gh release upload "$TAG" build/line-works.mcpb --clobber --repo "$REPO"
          else
            gh release create "$TAG" build/line-works.mcpb \
              --draft --target "$SHA" --title "$TAG" --generate-notes --repo "$REPO"
          fi
          echo "### 下書きリリース $TAG を作成しました" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "内容を確認して Publish してください: https://github.com/$REPO/releases" >> "$GITHUB_STEP_SUMMARY"
