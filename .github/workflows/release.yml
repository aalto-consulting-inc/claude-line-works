# バージョンを上げた PR が main にマージされると、この workflow が下書きリリースを作る。
# 人がやることは中身を確認して Publish するだけ。
#
# 手順:
#   1. Actions > Bump version でバージョンを指定して実行し、出来た PR をマージする
#   2. この workflow が発火し、整合チェック → テスト → `.mcpb` ビルド → 下書きリリース作成
#   3. 内容を確認して Publish release。git タグはこのとき初めて作られる
#
# 設計上の要点:
# - `release: [created]` は draft では発火しない(GitHub の仕様)。下書き作成を起点にはできないため、
#   下書きそのものをこの workflow が作る。
# - リリースするバージョンは入力させず、main のコードから読む。入力と実体がずれる余地をなくす。
# - version を書いたファイルへの push で発火するが、バージョンが上がっていない push
#   (依存更新など)ではタグの有無で判断してスキップする。main を赤くしない。
# - 確認中の下書きを push で上書きしない。下書きが既にある場合、更新するのは手動実行のときだけ。
# - 下書きの target は発火時の main の SHA に固定する。Publish までに main が進んでも、
#   ビルドした中身とタグの指す commit がずれない。
# - ビルドが全部通ってから下書きを作る。途中で落ちたときに中途半端な下書きを残さない。
name: Release

on:
  push:
    branches: [main]
    paths:
      - ".claude-plugin/plugin.json"
      - "mcpb/manifest.json"
      - "server/package.json"
      - "server/src/index.ts"
  # 取りこぼしたときや、確認中の下書きを作り直したいときの手動実行
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # リリースが必要かどうかだけを判定する。不要なら後続をまるごと飛ばす
  check:
    name: check version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      proceed: ${{ steps.gate.outputs.proceed }}
      state: ${{ steps.gate.outputs.state }}
    steps:
      - name: Check the workflow runs on main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::リリースは main から実行してください (現在: ${{ github.ref }})"
          exit 1

      - uses: actions/checkout@v4

      # バージョンはコードから読む。あわせて 5 ファイルが揃っているかも確認する。
      # ここでの不一致は main に不整合が入ったということなので、黙らせず落とす
      - name: Read the version from the code
        id: version
        run: |
          version=$(node -p "require('./.claude-plugin/plugin.json').version")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=.claude-plugin/plugin.json::version ($version) が x.y.z 形式ではありません"
            exit 1
          fi
          node scripts/bump-version.mjs "$version" --check
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Decide whether to release
        id: gate
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          state=none
          proceed=true

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::notice::$TAG は公開済み(タグあり)。リリースするものはない"
            proceed=false
          else
            state=$(gh api "repos/$REPO/releases?per_page=100" \
              --jq "[.[] | select(.tag_name == \"$TAG\")][0] | if . == null then \"none\" elif .draft then \"draft\" else \"published\" end")
            if [ "$state" = "published" ]; then
              echo "::notice::リリース $TAG は既に公開されている"
              proceed=false
            elif [ "$state" = "draft" ] && [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
              # 人が確認している最中の下書きを push で勝手に差し替えない
              echo "::notice::$TAG の下書きが既にある。作り直す場合は手動で Run workflow する"
              proceed=false
            fi
          fi

          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"

  release:
    name: build and draft
    needs: check
    if: needs.check.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
      TAG: ${{ needs.check.outputs.tag }}
      RELEASE_STATE: ${{ needs.check.outputs.state }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
        working-directory: server
      - run: npm run typecheck
        working-directory: server
      - run: npm test
        working-directory: server

      - name: Build MCPB
        run: npm run build:mcpb
        working-directory: server

      - name: Check dist/server.js is up to date
        run: git diff --exit-code -- dist
        # 失敗した場合: server/ の変更後に `npm run build` を実行して dist/ をコミットし直す

      - name: Smoke test (MCP tools/list)
        run: node scripts/smoke.mjs

      # 資産の sha256 は GitHub がアップロード時に計算し、リリース画面と API
      # (asset の digest)で公開する。workflow 側でチェックサムを添える必要はない
      #
      # 下書きを作り直すときも本文には触らない。自動生成のノートを人が
      # 書き換えていることがある
      - name: Create or update the draft release
        run: |
          if [ "$RELEASE_STATE" = "draft" ]; then
            gh release edit "$TAG" --target "$SHA" --repo "$REPO"
            gh release upload "$TAG" build/line-works.mcpb --clobber --repo "$REPO"
          else
            gh release create "$TAG" build/line-works.mcpb \
              --draft --target "$SHA" --title "$TAG" --generate-notes --repo "$REPO"
          fi
          echo "### 下書きリリース $TAG を作成しました" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "内容を確認して Publish してください: https://github.com/$REPO/releases" >> "$GITHUB_STEP_SUMMARY"
