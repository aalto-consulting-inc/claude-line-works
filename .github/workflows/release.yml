# GitHub 上で「下書きリリース」を作ると、この workflow が中身を埋める。
#
# 手順:
#   1. Releases > Draft a new release で新しいタグ `v<x.y.z>` を入力し、Target を main にして Save draft
#   2. この workflow が発火し、バージョン整合チェック → テスト → `.mcpb` ビルド → 下書きに添付
#   3. 内容を確認して Publish release。git タグはこのとき初めて作られる
#
# 設計上の要点:
# - `release: [created]` は「下書きが保存された」「下書きを経ずに公開された」のどちらでも発火する。
#   `edited` は購読しない。この workflow 自身が下書きを更新するため再発火してループする。
# - 下書きの時点ではタグがまだ存在しない。checkout する ref は下書きなら target_commitish(= main)、
#   公開済みのリリースならタグを使う。
# - `gh release upload` / `edit` はタグ名で下書きも解決できる(公開済みリリースの API で 404 になった場合、
#   下書き一覧から突き合わせる)。
# - GITHUB_TOKEN が作ったリリースは workflow を発火しないが、ここは人が UI で作るので問題ない。
name: Release

on:
  release:
    types: [created]

permissions: {}

jobs:
  release:
    name: build and attach
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 下書き: タグ未作成なので Target のブランチ。公開済み: タグそのもの
          ref: ${{ github.event.release.draft && github.event.release.target_commitish || github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      # 3 つのマニフェストの version とタグがずれたままリリースするのを防ぐ
      - name: Check versions match the tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::タグ名 ($TAG) が v<x.y.z> 形式ではありません"
            exit 1
          fi
          version="${TAG#v}"
          for f in .claude-plugin/plugin.json mcpb/manifest.json server/package.json; do
            v=$(node -p "require('./$f').version")
            if [ "$v" != "$version" ]; then
              echo "::error file=$f::version ($v) がタグ ($TAG) と一致しません"
              exit 1
            fi
          done

      - run: npm ci
        working-directory: server
      - run: npm run typecheck
        working-directory: server
      - run: npm test
        working-directory: server

      - name: Build MCPB
        run: npm run build:mcpb
        working-directory: server

      - name: Check dist/server.js is up to date
        run: git diff --exit-code -- dist
        # 失敗した場合: server/ の変更後に `npm run build` を実行して dist/ をコミットし直す

      - name: Smoke test (MCP tools/list)
        run: node scripts/smoke.mjs

      # 公開配布物なので、利用者が改ざんを検知できるようチェックサムを添える。
      # `sha256sum -c line-works.mcpb.sha256` でそのまま検証できる形式で出力する
      - name: Generate checksum
        run: |
          cd build
          sha256sum line-works.mcpb > line-works.mcpb.sha256
          cat line-works.mcpb.sha256

      - name: Attach assets to the release
        run: |
          gh release upload "$TAG" \
            build/line-works.mcpb \
            build/line-works.mcpb.sha256 \
            --clobber --repo "$REPO"

      # リリースノートを確定させる。
      # - 本文が空のときだけ自動生成ノートを入れる。手で書いた本文は上書きしない
      # - 最後にチェックサムを追記する。マーカーで囲んで毎回置き換えるので再実行しても重複しない
      #
      # 下書きの本文はイベントペイロードから取る。`gh release view` はタグ未作成の
      # 下書きを解決できないことがあるため使わない。
      - name: Update release notes
        env:
          TARGET: ${{ github.event.release.target_commitish }}
          # 本文は人が書く任意テキスト。run に直接展開するとスクリプトインジェクションに
          # なるため、必ず環境変数経由で受け取る
          BODY: ${{ github.event.release.body }}
        run: |
          if [ -z "$BODY" ]; then
            gh api --method POST "repos/$REPO/releases/generate-notes" \
              -f tag_name="$TAG" -f target_commitish="$TARGET" --jq .body > /tmp/body.md
          else
            printf '%s\n' "$BODY" > /tmp/body.md
            sed -i '/<!-- sha256:start -->/,/<!-- sha256:end -->/d' /tmp/body.md
          fi
          {
            echo
            echo '<!-- sha256:start -->'
            echo '### チェックサム'
            echo
            echo '```'
            cat build/line-works.mcpb.sha256
            echo '```'
            echo
            echo '検証: `sha256sum -c line-works.mcpb.sha256`'
            echo '(Windows は `certutil -hashfile line-works.mcpb SHA256`)'
            echo '<!-- sha256:end -->'
          } >> /tmp/body.md
          gh release edit "$TAG" --notes-file /tmp/body.md --repo "$REPO"
